<html>
<head></head>
<title>maths and string</title>
<body bgcolor="pink">
<h1><i><b><center>Maths and String Function</center></b></i></h1>
<script>
var a="hello";
var b=123;
var c="welcome";
var d=a+b+c;
document.write("string1= " +a + "<br><br>");
document.write("string2=" +b + "<br><br>");
document.write("string3=" +c + "<br>");

document.write("<h2>String Functions</h2>");
document.write("1.concatination= " + a + b + c + "<br><br>");
document.write("2.length=" , d.length+ "<br><br>");
document.write("3.uppercase=" , d.toUpperCase()+ "<br><br>");
document.write("4.lowercase=" ,d.toLowerCase()+ "<br><br>");
document.write("5.slice=" ,d.slice(3,8)+ "<br><br>");
document.write("6.replace=" ,a.replace("h","w")+ "<br>");

document.write("<h2>Math Functions</h2>");
document.write("1.round=" ,Math.round(2.5)+ "<br><br>");
document.write("2.floor=" ,Math.floor(2.5)+ "<br><br>");
document.write("3.ceil=" ,Math.ceil(2.5)+ "<br><br>");
document.write("4.squareroot=" ,Math.sqrt(25)+ "<br><br>");
document.write("5.power=" ,Math.pow(2,3)+  "<br><br>");
document.write("6.maximum=" ,Math.max(40,10,20)+ "<br><br>");
document.write("7.minimum=" ,Math.min(40,10,20)+ "<br><br>");
document.write("8.absolute=" ,Math.abs(-5)+ "<br><br>");
</script>

</body>
</html>
